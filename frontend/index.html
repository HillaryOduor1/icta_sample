<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <!--CRITICAL: THEME SCRIPT — must be first in <head>,Runs synchronously before any paint. Prevents,white/dark flash on all browsers (ES5-safe).-->
    <script>
      (function () {
        var KEY = 'vite-ui-theme';
        var BG_DARK  = '#0a0a0a';
        var BG_LIGHT = '#f8f5f5';
        try {
          var stored = localStorage.getItem(KEY);
          var theme = (stored === 'dark' || stored === 'light' || stored === 'system')
            ? stored : 'system';
          var resolved = (theme === 'system')
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark' : 'light')
            : theme;
          document.documentElement.classList.add(resolved);
          document.documentElement.setAttribute('data-theme', resolved);
          /* Stamp background before CSS loads so there is zero flash */
          var bg = resolved === 'dark' ? BG_DARK : BG_LIGHT;
          document.documentElement.style.backgroundColor = bg;
        } catch (e) {
          document.documentElement.classList.add('light');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.backgroundColor = BG_LIGHT;
        }
      })();
    </script>

    <!-- ENCODING & VIEWPORT-->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--
      width=device-width  — match device screen width
      viewport-fit=cover  — fill notch / Dynamic Island area on iPhone
      shrink-to-fit=no    — prevent Safari from auto-shrinking on iPad split-view
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, shrink-to-fit=no"
    />

    <!-- PRIMARY SEO ,Title: 50-60 chars, keyword first, Description: 140-155 chars, active voice, unique value prop -->
    <title>ICT Authority Kenya – Digital Government Services</title>
    <meta
      name="description"
      content="Kenya's ICT Authority drives digital transformation, e-government services, and the National Digital Masterplan 2022–2032. Explore services, tenders, and resources."
    />
    <meta
      name="keywords"
      content="ICT Authority Kenya, digital government Kenya, e-government services, ICTA, National Digital Masterplan, Kenya ICT"
    />
    <meta name="author" content="ICT Authority Kenya" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical — prevents duplicate-content penalties -->
    <link rel="canonical" href="https://icta.go.ke/" />

    <!-- Language alternates (add more if you have Swahili pages) -->
    <link rel="alternate" hreflang="en-ke" href="https://icta.go.ke/" />
    <link rel="alternate" hreflang="x-default" href="https://icta.go.ke/" />

    <!-- OPEN GRAPH (Facebook, WhatsApp, LinkedIn), og:image should be 1200×630px, < 1MB -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="ICT Authority Kenya" />
    <meta property="og:locale"      content="en_KE" />
    <meta property="og:url"         content="https://icta.go.ke/" />
    <meta property="og:title"       content="ICT Authority Kenya – Digital Government Services" />
    <meta
      property="og:description"
      content="Kenya's ICT Authority drives digital transformation, e-government services, and the National Digital Masterplan 2022–2032."
    />
    <meta property="og:image"              content="https://icta.go.ke/assets/img/og-image.jpg" />
    <meta property="og:image:secure_url"   content="https://icta.go.ke/assets/img/og-image.jpg" />
    <meta property="og:image:type"         content="image/jpeg" />
    <meta property="og:image:width"        content="1200" />
    <meta property="og:image:height"       content="630" />
    <meta property="og:image:alt"          content="ICT Authority Kenya – Digital Transformation" />

    <!--TWITTER / X CARDS-->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@ICTAuthorityKE" />
    <meta name="twitter:creator"     content="@ICTAuthorityKE" />
    <meta name="twitter:url"         content="https://icta.go.ke/" />
    <meta name="twitter:title"       content="ICT Authority Kenya – Digital Government Services" />
    <meta
      name="twitter:description"
      content="Kenya's ICT Authority drives digital transformation, e-government services, and the National Digital Masterplan 2022–2032."
    />
    <meta name="twitter:image"       content="https://icta.go.ke/assets/img/og-image.jpg" />
    <meta name="twitter:image:alt"   content="ICT Authority Kenya – Digital Transformation" />

    <!--ANDROID / CHROME PWA, theme-color controls the browser/status-bar chrome -->
    <meta name="theme-color" content="#f20d0d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    

    <!-- APPLE / iOS PWA, apple-mobile-web-app-capable — enables standalone (full-screen) mode, status-bar-style options: default | black | black-translucent, Use black-translucent if your navbar extends under the status bar,and you handle safe-area-inset-* in CSS.-->
    <meta name="apple-mobile-web-app-capable"          content="yes" />
    <meta name="apple-mobile-web-app-title"            content="ICT Authority" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Apple touch icons — Safari uses these for the home screen bookmark.
         Must be in <head>, takes priority over manifest icons on older iOS. -->
    <link rel="apple-touch-icon"              href="/icons/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />

    <!-- Apple splash screens,they are Needed because iOS PWAs require one per screen resolution Generate all sizes at: https://progressier.com/pwa-icons-and-ios-splash-screen-generator, then host under /splash/ and add each <link> here. Example for key sizes: -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
      href="/splash/apple-splash-1290-2796.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
      href="/splash/apple-splash-1179-2556.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
      href="/splash/apple-splash-1170-2532.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
      href="/splash/apple-splash-1125-2436.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)"
      href="/splash/apple-splash-828-1792.png"
    />

    <!--FAVICON SET, Serve favicon.svg for modern browsers (scales perfectly), favicon.ico as the universal fallback.-->
    <link rel="icon" type="image/svg+xml"  href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="shortcut icon"              href="/icons/favicon.ico" />

    <!--STRUCTURED DATA — JSON-LD, Gives Google rich results (logo, sitelinks searchbox, etc.), Government organization schema is the correct type here.-->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GovernmentOrganization",
      "name": "ICT Authority Kenya",
      "alternateName": "ICTA",
      "url": "https://icta.go.ke",
      "logo": {
        "@type": "ImageObject",
        "url": "https://icta.go.ke/assets/img/logo.png",
        "width": 300,
        "height": 60
      },
      "description": "The ICT Authority is a State Corporation under the Ministry of Information Communication and Digital Economy, responsible for rationalizing and managing all ICT resources in government.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Telposta Towers, Kenyatta Avenue",
        "addressLocality": "Nairobi",
        "addressCountry": "KE",
        "postalCode": "00100"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+254-020-2089061",
        "contactType": "customer service",
        "availableLanguage": ["English", "Swahili"]
      },
      "sameAs": [
        "https://twitter.com/ICTAuthorityKE",
        "https://www.linkedin.com/company/ict-authority-kenya",
        "https://www.facebook.com/ICTAuthorityKE"
      ]
    }
    </script>

    <!--WEBSITE SITELINKS SEARCHBOX, Enables the search box Google can show in SERPs -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://icta.go.ke/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://icta.go.ke/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!--PERFORMANCE — FONT LOADING, preconnect reduces DNS + TLS handshake time.Font-display:swap prevents invisible text during load.-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
      crossorigin
    />

    <!--PRELOAD CRITICAL ASSETS, Add your hero image / above-the-fold CSS here. fetchpriority="high" tells the browser this matters most.-->
    <!-- Example — update src path to actual hero image:
    <link rel="preload" as="image" href="/assets/img/hero.webp" fetchpriority="high" />
    -->

    <!--ACCESSIBILITY — SKIP LINK STYLES, Rendered before JS so it works even if React is slow -->
    <style>
      /* Skip-to-content link — visually hidden until focused */
      .skip-to-content {
        position: absolute;
        top: -100%;
        left: 1rem;
        padding: 0.5rem 1rem;
        background: #f20d0d;
        color: #fff;
        font-weight: 700;
        border-radius: 0 0 6px 6px;
        text-decoration: none;
        z-index: 9999;
        transition: top 0.2s ease;
      }
      .skip-to-content:focus {
        top: 0;
      }

      /*Pre-paint body background matching the theme script above. Overridden by Tailwind once CSS loads. this just covers the ~16ms gap between HTML parse and CSS evaluation.*/
      html { background-color: #f8f5f5; }
      html.dark { background-color: #0a0a0a; }
    </style>
  </head>

  <body>
    <!-- Accessibility: skip repetitive navigation on every page load -->
    <a href="#main-content" class="skip-to-content">Skip to main content</a>

    <div id="root"></div>

    <!-- Entry point — Vite injects the correct hashed filename in production -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
